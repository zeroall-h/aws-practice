<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS 배포 연습</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="img/logo.png" alt="로고" class="logo">
    <h1>AWS 배포 연습 사이트</h1>
  </header>

  <main>
    <section class="hero">
      <img src="img/hero.png" alt="메인 이미지">
      <p>이 페이지가 보이면 S3 배포 성공!</p>
    </section>

    <section class="cards">
      <article class="card">
        <img src="img/card1.png" alt="카드 1">
        <h2>1단계</h2>
        <p>S3 정적 웹사이트 호스팅</p>
      </article>
      <article class="card">
        <img src="img/card2.png" alt="카드 2">
        <h2>2단계</h2>
        <p>CloudFront 연결</p>
      </article>
      <article class="card">
        <img src="img/card3.png" alt="카드 3">
        <h2>3단계</h2>
        <p>해시 + manifest 배포</p>
      </article>
    </section>
  </main>

  <footer>
    <p>버전: v1</p>
  </footer>
</body>
</html>
